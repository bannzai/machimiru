name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Node 24 は npm 11 を同梱し、ローカルの npm 11 が生成した package-lock.json をそのまま npm ci できる
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: make setup
      - run: make lint
      - run: make build-web
      # next build が生成する next-env.d.ts を参照するため build-web の後に実行する
      - run: make typecheck
      - run: make test

  # 画面の確認をローカルのブラウザで行わないため、runner 上の Chromium で各ページを撮影して artifact に残す (AGENTS.md「検証方法」)
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: make setup
      - run: npx playwright install --with-deps chromium
      - run: make build-web
      - run: make screenshot

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: screenshots
          path: |
            tmp/screenshots
            tmp/playwright
          if-no-files-found: error
